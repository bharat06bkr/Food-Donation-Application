<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Receiver Dashboard - Food Donation System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    h1 {
      color: #ff6600;
      text-align: center;
      margin-bottom: 10px;
    }

    p.welcome {
      color: #555555;
      text-align: center;
      margin-bottom: 20px;
      font-size: 16px;
    }

    a.logout {
      display: block;
      text-align: center;
      margin-bottom: 30px;
      color: #ffffff;
      background-color: #ff6600;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      width: 100px;
      margin-left: auto;
      margin-right: auto;
      transition: background-color 0.3s;
    }

    a.logout:hover {
      background-color: #e65c00;
    }

    h2 {
      color: #ff6600;
      margin-bottom: 15px;
    }

    .error-message {
      color: red;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    table th, table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    table th {
      background-color: #ff6600;
      color: white;
    }

    button {
      background-color: #ff6600;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #e65c00;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Receiver Dashboard</h1>
  <p class="welcome">Welcome, <span th:text="${currentUser.email}"></span>!</p>
  <a th:href="@{/logout}" class="logout">Logout</a>

  <h2>Available Foods</h2>

  <p th:if="${error}" th:text="${error}" class="error-message"></p>

  <table>
    <thead>
    <tr>
      <th>Food Type</th>
      <th>Quantity</th>
      <th>Contact Info</th>
      <th>Donor</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="food : ${availableFoods}">
      <td th:text="${food.foodType}"></td>
      <td th:text="${food.quantity}"></td>
      <td th:text="${food.contactInfo}"></td>
      <td th:text="${food.donor.email}"></td>
      <td>
        <form th:action="@{'/receiver/book-food/' + ${food.id}}" method="post">
          <button type="submit">Book</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
